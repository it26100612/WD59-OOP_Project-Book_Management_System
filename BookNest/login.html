<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BookNest</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <!-- Logo Header -->
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand-booknest justify-content-center d-inline-flex mb-2">
            <div class="brand-icon-box">
              <i class="bi bi-book-half"></i>
            </div>
            <span class="fs-3">BookNest</span>
          </a>
          <h4 class="fw-bold mt-2">Welcome Back</h4>
          <p class="text-muted small">Sign in to your BookNest account</p>
        </div>

        <!-- Login Card -->
        <div class="card login-main-card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white mb-3">
          <form id="login-form">
            <!-- Email -->
            <div class="mb-3">
              <label for="login-email" class="form-label small fw-bold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="login-password" class="form-label small fw-bold mb-0">Password</label>
                <a href="javascript:void(0)" onclick="alert('Demo Mode: Please use demo accounts or any password.')" class="small text-muted text-decoration-none">Forgot?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key text-muted"></i></span>
                <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
                <button class="btn btn-outline-secondary" type="button" id="toggle-login-password" aria-label="Toggle password visibility">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <!-- Remember Me -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="remember-me" checked>
              <label class="form-check-label small text-muted" for="remember-me">
                Remember me on this browser
              </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to BookNest
            </button>

            <!-- Register Link -->
            <div class="text-center small text-muted">
              Don't have an account yet? <a href="register.html" class="fw-bold text-primary">Create an account</a>
            </div>
          </form>
        </div>

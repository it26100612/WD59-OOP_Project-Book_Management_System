<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — BookNest</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <!-- Logo Header -->
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand-booknest justify-content-center d-inline-flex mb-2">
            <div class="brand-icon-box">
              <i class="bi bi-book-half"></i>
            </div>
            <span class="fs-3">BookNest</span>
          </a>
          <h4 class="fw-bold mt-2">Create New Account</h4>
          <p class="text-muted small">Join BookNest to explore and purchase books online</p>
        </div>

        <!-- Registration Card -->
        <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white mb-3">
          <form id="register-form">
            <!-- Full Name -->
            <div class="mb-3">
              <label for="register-name" class="form-label small fw-bold">Full Name *</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                <input type="text" id="register-name" class="form-control" placeholder="e.g. Kasun Bandara" required>
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="register-email" class="form-label small fw-bold">Email Address *</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="register-email" class="form-control" placeholder="name@domain.com" required>
              </div>
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
              <label for="register-phone" class="form-label small fw-bold">Contact Phone Number *</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-telephone text-muted"></i></span>
                <input type="tel" id="register-phone" class="form-control" placeholder="e.g. +94 77 123 4567" required>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label for="register-password" class="form-label small fw-bold">Password *</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" id="register-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
              <label for="register-confirm-password" class="form-label small fw-bold">Confirm Password *</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-lock text-muted"></i></span>
                <input type="password" id="register-confirm-password" class="form-control" placeholder="Re-enter your password" minlength="6" required>
              </div>
            </div>

            <!-- Register Button -->
            <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
              <i class="bi bi-person-plus me-1"></i> Register Account
            </button>

            <!-- Login Link -->
            <div class="text-center small text-muted">
              Already have an account? <a href="login.html" class="fw-bold text-primary">Sign in</a>
            </div>
          </form>
        </div>

        <!-- Back to Store Link -->
        <div class="text-center mt-3">
          <a href="index.html" class="text-muted small text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Return to Bookstore Home
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data Engine & App Scripts -->
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
